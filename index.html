html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation Of Destiny - Clan Recruitment</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: linear-gradient(145deg, #111622, #0d121d);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #1f293d;
        }
        .clan-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .clan-link:hover {
            transform: scale(1.03);
        }
        .emblem {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
            border: 2px solid #2a374e;
        }
        .instructions {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 500;
        }
        .click-hint {
            color: #38bdf8;
            font-size: 0.9rem;
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<meta name="google-site-verification" content="google563cc44418ad6a49" />
<div class="container">
    <!-- Clickable Emblem Area -->
    <a href="https://www.bungie.net/7/en/Clan/Profile/4832315" class="clan-link" title="Join Creation Of Destiny">
        <img src="YOUR_UPLOADED_IMAGE_URL_HERE" alt="Creation Of Destiny Clan Emblem" class="emblem">
    </a>
    
    <div class="instructions">Click the emblem above to visit our official Bungie Clan Page</div>
    <div class="click-hint">Mic Required • PlayStation Main • 18+</div>
</div>

</body>
</html>
